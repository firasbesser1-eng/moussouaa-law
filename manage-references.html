<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>إدارة المراجع | الموسوعة القانونية</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

header {
    background:
        linear-gradient(135deg, #071a2d, #123b5d);

    color: white;
    padding: 25px 18px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
    font-size: 27px;
}

header p {
    margin: 0;
    opacity: .85;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

/* أزرار */

.top-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.btn {
    display: inline-block;
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    cursor: pointer;
    text-decoration: none;
    font-size: 14px;
}

.btn-primary {
    background: #123b5d;
    color: white;
}

.btn-success {
    background: #198754;
    color: white;
}

.btn-danger {
    background: #b42318;
    color: white;
}

.btn-secondary {
    background: #64748b;
    color: white;
}

/* البحث */

.search-box {
    background: white;
    padding: 18px;
    border-radius: 16px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

.search-box input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d5dce5;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

.search-box input:focus {
    border-color: #123b5d;
}

/* الإحصائيات */

.stats {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

.stat-number {
    font-size: 30px;
    font-weight: bold;
    color: #123b5d;
}

.stat-title {
    color: #64748b;
    font-size: 14px;
}

/* المراجع */

.references {
    display: grid;
    gap: 18px;
}

.reference-card {
    background: white;
    border-radius: 18px;
    padding: 20px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.07);

    border: 1px solid #e5eaf0;
}

.reference-title {
    color: #0b2944;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 8px;
}

.reference-info {
    color: #64748b;
    font-size: 14px;
    margin: 5px 0;
}

.badge {
    display: inline-block;

    background: #eef4f9;
    color: #123b5d;

    padding: 5px 11px;

    border-radius: 20px;

    font-size: 12px;

    margin-top: 8px;
}

.card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

.loading,
.empty,
.error {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 16px;
}

.error {
    color: #b42318;
}

/* الهاتف */

@media (max-width: 600px) {

    header h1 {
        font-size: 23px;
    }

    .card-actions {
        flex-direction: column;
    }

    .card-actions .btn {
        width: 100%;
        text-align: center;
    }

}

</style>

</head>


<body>


<header>

    <h1>
        ⚖️ إدارة المراجع
    </h1>

    <p>
        الموسوعة القانونية
    </p>

</header>


<div class="container">


    <div class="top-actions">

        <a
            href="dashboard.html"
            class="btn btn-secondary">

            ← لوحة التحكم

        </a>

        <a
            href="add-reference.html"
            class="btn btn-success">

            ➕ إضافة مرجع

        </a>

        <a
            href="index.html"
            target="_blank"
            class="btn btn-primary">

            🌐 فتح الموقع

        </a>

    </div>


    <!-- الإحصائيات -->

    <div class="stats">

        <div class="stat">

            <div
                class="stat-number"
                id="totalReferences">

                0

            </div>

            <div class="stat-title">
                إجمالي المراجع
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="totalBranches">

                0

            </div>

            <div class="stat-title">
                الفروع
            </div>

        </div>

    </div>


    <!-- البحث -->

    <div class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="🔎 ابحث عن عنوان المرجع أو المؤلف..."
            oninput="filterReferences()">

    </div>


    <!-- القائمة -->

    <div
        id="references"
        class="references">

        <div class="loading">
            ⏳ جاري تحميل المراجع...
        </div>

    </div>


</div>


<script>


/* =====================================
   إعداد Supabase
===================================== */

const SUPABASE_URL =
    "https://yksrckzomkowjzmsafvm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEa1cABilAnrnclvOTv-IA_yFcn7aIV";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let allReferences = [];


/* =====================================
   حماية HTML
===================================== */

function escapeHTML(value) {

    if (!value) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================
   التحقق من تسجيل الدخول
===================================== */

async function checkSession() {

    const {
        data
    } =
        await supabaseClient.auth.getSession();


    if (!data.session) {

        window.location.href =
            "admin.html";

        return false;
    }

    return true;
}


/* =====================================
   تحميل المراجع
===================================== */

async function loadReferences() {

    const container =
        document.getElementById(
            "references"
        );


    container.innerHTML =
        '<div class="loading">⏳ جاري تحميل المراجع...</div>';


    const {
        data,
        error
    } =
        await supabaseClient
        .from("references")
        .select(`
            id,
            title,
            author,
            description,
            file_path,
            created_at,
            branch_id,
            category_id
        `)
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML =
            `
            <div class="error">
                ❌ تعذر تحميل المراجع.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
            `;

        return;
    }


    allReferences =
        data || [];


    document.getElementById(
        "totalReferences"
    ).textContent =
        allReferences.length;


    await loadNames();


    displayReferences(
        allReferences
    );
}


/* =====================================
   تحميل أسماء الفروع والتصنيفات
===================================== */

async function loadNames() {

    const {
        data: branches
    } =
        await supabaseClient
        .from("branches")
        .select("id,name");


    const {
        data: categories
    } =
        await supabaseClient
        .from("reference_categories")
        .select("id,name");


    const branchMap = {};
    const categoryMap = {};


    (branches || []).forEach(
        branch => {

            branchMap[branch.id] =
                branch.name;

        }
    );


    (categories || []).forEach(
        category => {

            categoryMap[category.id] =
                category.name;

        }
    );


    allReferences.forEach(
        reference => {

            reference.branchName =
                branchMap[
                    reference.branch_id
                ] || "غير محدد";


            reference.categoryName =
                categoryMap[
                    reference.category_id
                ] || "غير محدد";

        }
    );


    document.getElementById(
        "totalBranches"
    ).textContent =
        (branches || []).length;
}


/* =====================================
   عرض المراجع
===================================== */

function displayReferences(
    references
) {

    const container =
        document.getElementById(
            "references"
        );


    if (
        !references ||
        references.length === 0
    ) {

        container.innerHTML =
            `
            <div class="empty">
                📚 لا توجد مراجع.
            </div>
            `;

        return;
    }


    container.innerHTML = "";


    references.forEach(
        reference => {


            let pdfUrl = "#";


            if (reference.file_path) {

                const {
                    data
                } =
                    supabaseClient
                    .storage
                    .from("legal-pdfs")
                    .getPublicUrl(
                        reference.file_path
                    );

                pdfUrl =
                    data.publicUrl;
            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "reference-card";


            card.dataset.id =
                reference.id;


            card.innerHTML =
                `

                <div class="reference-title">

                    📚
                    ${escapeHTML(
                        reference.title
                    )}

                </div>


                ${
                    reference.author
                    ?
                    `
                    <div class="reference-info">
                        ✍️ المؤلف:
                        ${escapeHTML(
                            reference.author
                        )}
                    </div>
                    `
                    :
                    ""
                }


                <div class="reference-info">

                    📂 الفرع:
                    ${escapeHTML(
                        reference.branchName
                    )}

                </div>


                <span class="badge">

                    ${escapeHTML(
                        reference.categoryName
                    )}

                </span>


                ${
                    reference.description
                    ?
                    `
                    <div class="reference-info">

                        📝
                        ${escapeHTML(
                            reference.description
                        )}

                    </div>
                    `
                    :
                    ""
                }


                <div class="card-actions">


                    ${
                        reference.file_path
                        ?
                        `
                        <a
                            href="${pdfUrl}"
                            target="_blank"
                            class="btn btn-primary">

                            📄 فتح PDF

                        </a>
                        `
                        :
                        ""
                    }


                    <button
                        class="btn btn-danger"
                        onclick="deleteReference(${reference.id})">

                        🗑️ حذف

                    </button>


                </div>

                `;


            container.appendChild(
                card
            );

        }
    );
}


/* =====================================
   البحث
===================================== */

function filterReferences() {

    const search =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    if (!search) {

        displayReferences(
            allReferences
        );

        return;
    }


    const filtered =
        allReferences.filter(
            reference => {

                const text =
                    `
                    ${reference.title || ""}
                    ${reference.author || ""}
                    ${reference.description || ""}
                    ${reference.branchName || ""}
                    ${reference.categoryName || ""}
                    `
                    .toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    displayReferences(
        filtered
    );
}


/* =====================================
   حذف المرجع
===================================== */

async function deleteReference(
    id
) {

    const reference =
        allReferences.find(
            item =>
                item.id === id
        );


    if (!reference) {
        return;
    }


    const confirmed =
        confirm(
            "هل أنت متأكد من حذف هذا المرجع؟"
        );


    if (!confirmed) {
        return;
    }


    /* حذف الملف من Storage */

    if (
        reference.file_path
    ) {

        const {
            error:
            storageError
        } =
            await supabaseClient
            .storage
            .from("legal-pdfs")
            .remove([
                reference.file_path
            ]);


        if (storageError) {

            alert(
                "تعذر حذف ملف PDF: " +
                storageError.message
            );

            return;
        }
    }


    /* حذف بيانات المرجع */

    const {
        error
    } =
        await supabaseClient
        .from("references")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "تعذر حذف المرجع: " +
            error.message
        );

        return;
    }


    alert(
        "تم حذف المرجع بنجاح ✅"
    );


    await loadReferences();
}


/* =====================================
   تشغيل الصفحة
===================================== */

async function init() {

    const loggedIn =
        await checkSession();


    if (!loggedIn) {
        return;
    }


    await loadReferences();
}


init();

</script>


</body>

                reference.id;


            card.innerHTML =
                `

                <div class="reference-title">

                    📚
                    ${escapeHTML(
                        reference.title
                    )}

                </div>


                ${
                    reference.author
                    ?
                    `
                    <div class="reference-info">
                        ✍️ المؤلف:
                        ${escapeHTML(
                            reference.author
                        )}
                    </div>
                    `
                    :
                    ""
                }


                <div class="reference-info">

                    📂 الفرع:
                    ${escapeHTML(
                        reference.branchName
                    )}

                </div>


                <span class="badge">

                    ${escapeHTML(
                        reference.categoryName
                    )}

                </span>


                ${
                    reference.description
                    ?
                    `
                    <div class="reference-info">

                        📝
                        ${escapeHTML(
                            reference.description
                        )}

                    </div>
                    `
                    :
                    ""
                }


                <div class="card-actions">


                    ${
                        reference.file_path
                        ?
                        `
                        <a
                            href="${pdfUrl}"
                            target="_blank"
                            class="btn btn-primary">

                            📄 فتح PDF

                        </a>
                        `
                        :
                        ""
                    }


                    <button
                        class="btn btn-danger"
                        onclick="deleteReference(${reference.id})">

                        🗑️ حذف

                    </button>


                </div>

                `;


            container.appendChild(
                card
            );

        }
    );
}


/* =====================================
   البحث
===================================== */

function filterReferences() {

    const search =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    if (!search) {

        displayReferences(
            allReferences
        );

        return;
    }


    const filtered =
        allReferences.filter(
            reference => {

                const text =
                    `
                    ${reference.title || ""}
                    ${reference.author || ""}
                    ${reference.description || ""}
                    ${reference.branchName || ""}
                    ${reference.categoryName || ""}
                    `
                    .toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    displayReferences(
        filtered
    );
}


/* =====================================
   حذف المرجع
===================================== */

async function deleteReference(
    id
) {

    const reference =
        allReferences.find(
            item =>
                item.id === id
        );


    if (!reference) {
        return;
    }


    const confirmed =
        confirm(
            "هل أنت متأكد من حذف هذا المرجع؟"
        );


    if (!confirmed) {
        return;
    }


    /* حذف الملف من Storage */

    if (
        reference.file_path
    ) {

        const {
            error:
            storageError
        } =
            await supabaseClient
            .storage
            .from("legal-pdfs")
            .remove([
                reference.file_path
            ]);


        if (storageError) {

            alert(
                "تعذر حذف ملف PDF: " +
                storageError.message
            );

            return;
        }
    }


    /* حذف بيانات المرجع */

    const {
        error
    } =
        await supabaseClient
        .from("references")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "تعذر حذف المرجع: " +
            error.message
        );

        return;
    }


    alert(
        "تم حذف المرجع بنجاح ✅"
    );


    await loadReferences();
}


/* =====================================
   تشغيل الصفحة
===================================== */

async function init() {

    const loggedIn =
        await checkSession();


    if (!loggedIn) {
        return;
    }


    await loadReferences();
}


init();

</script>
