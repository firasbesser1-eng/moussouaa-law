<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>إدارة المراجع | الموسوعة القانونية</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef3f8,
                    #f8fafc
                );

            color: #172033;

            min-height: 100vh;
        }

        header {
            background:
                linear-gradient(
                    135deg,
                    #071a35,
                    #0d315c,
                    #164d7c
                );

            color: white;

            padding: 28px 18px;

            box-shadow:
                0 8px 25px rgba(0,0,0,.15);
        }

        .header-container {
            max-width: 1100px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }

        .logo {
            display: flex;

            align-items: center;

            gap: 12px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.12);

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 28px;
        }

        .logo h1 {
            font-size: 23px;

            margin-bottom: 5px;
        }

        .logo p {
            font-size: 13px;

            opacity: .8;
        }

        main {
            max-width: 1100px;

            margin: 30px auto;

            padding: 0 18px;
        }

        .top-bar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        .back {
            text-decoration: none;

            color: white;

            background: #0d315c;

            padding: 11px 18px;

            border-radius: 10px;

            font-weight: bold;
        }

        .add {
            text-decoration: none;

            color: white;

            background: #15803d;

            padding: 11px 18px;

            border-radius: 10px;

            font-weight: bold;
        }

        .stats {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;

            margin-bottom: 22px;
        }

        .stat {
            background: white;

            border-radius: 16px;

            padding: 20px;

            text-align: center;

            box-shadow:
                0 5px 20px rgba(0,0,0,.06);
        }

        .stat-number {
            font-size: 30px;

            font-weight: bold;

            color: #0d315c;

            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;

            font-size: 14px;
        }

        .search-box {
            background: white;

            padding: 18px;

            border-radius: 16px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.06);
        }

        .search-box input {
            width: 100%;

            padding: 14px 16px;

            border:
                1px solid #d1d5db;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        .search-box input:focus {
            border-color: #164d7c;
        }

        #referencesContainer {
            display: grid;

            gap: 18px;
        }

        .reference-card {
            background: white;

            border-radius: 18px;

            padding: 22px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.06);

            border:
                1px solid #e5e7eb;
        }

        .reference-title {
            color: #0d315c;

            font-size: 20px;

            margin-bottom: 12px;
        }

        .reference-info {
            display: grid;

            gap: 7px;

            margin-bottom: 15px;

            color: #475569;

            font-size: 14px;
        }

        .description {
            background: #f8fafc;

            padding: 12px;

            border-radius: 10px;

            color: #475569;

            line-height: 1.7;

            margin-bottom: 16px;
        }

        .card-actions {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;

            border: none;

            cursor: pointer;

            padding: 10px 15px;

            border-radius: 9px;

            color: white;

            font-weight: bold;

            font-size: 14px;
        }

        .btn-primary {
            background: #164d7c;
        }

        .btn-success {
            background: #15803d;
        }

        .btn-danger {
            background: #b91c1c;
        }

        .loading,
        .empty,
        .error {
            background: white;

            padding: 35px;

            text-align: center;

            border-radius: 16px;

            color: #64748b;
        }

        .error {
            color: #b91c1c;
        }

        footer {
            text-align: center;

            color: #64748b;

            padding: 30px 15px;

            font-size: 13px;
        }

        @media (max-width: 600px) {

            .header-container {
                flex-direction: column;

                text-align: center;
            }

            .logo {
                justify-content: center;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .top-bar {
                flex-direction: column;

                align-items: stretch;
            }

            .back,
            .add {
                text-align: center;
            }

            .card-actions {
                flex-direction: column;
            }

            .btn {
                text-align: center;

                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-container">

        <div class="logo">

            <div class="logo-icon">
                ⚖️
            </div>

            <div>

                <h1>
                    إدارة المراجع
                </h1>

                <p>
                    الموسوعة القانونية
                </p>

            </div>

        </div>

    </div>

</header>


<main>


    <div class="top-bar">

        <a
            href="dashboard.html"
            class="back">

            ← لوحة التحكم

        </a>


        <a
            href="add-reference.html"
            class="add">

            ➕ إضافة مرجع

        </a>

    </div>


    <div class="stats">

        <div class="stat">

            <div
                id="referencesCount"
                class="stat-number">

                ...

            </div>

            <div class="stat-label">

                إجمالي المراجع

            </div>

        </div>


        <div class="stat">

            <div
                id="branchesCount"
                class="stat-number">

                ...

            </div>

            <div class="stat-label">

                الفروع

            </div>

        </div>

    </div>


    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 ابحث عن عنوان المرجع أو المؤلف...">

    </div>


    <div id="referencesContainer">

        <div class="loading">

            ⏳ جاري تحميل المراجع...

        </div>

    </div>


</main>


<footer>

    ⚖️ الموسوعة القانونية

    <br><br>

    إدارة الموقع: فراس بسر

</footer>


<script>


/* =========================================
   SUPABASE
========================================= */


const SUPABASE_URL =
    "https://yksrckzomkowjzmsafvm.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_VEa1cABilAnrnclvOTv-IA_yFcn7aIV";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let allReferences = [];


/* =========================================
   التحقق من تسجيل الدخول
========================================= */


async function checkSession() {

    const {
        data,
        error
    } =
        await supabaseClient
        .auth
        .getSession();


    if (error) {

        console.error(error);

        window.location.href =
            "admin.html";

        return;

    }


    if (!data.session) {

        window.location.href =
            "admin.html";

        return;

    }


    loadReferences();

}


/* =========================================
   تحميل المراجع
========================================= */


async function loadReferences() {

    const container =
        document.getElementById(
            "referencesContainer"
        );


    container.innerHTML =
        `
        <div class="loading">
            ⏳ جاري تحميل المراجع...
        </div>
        `;


    const {
        data,
        error
    } =
        await supabaseClient
        .from("references")
        .select(`
            id,
            title,
            author,
            description,
            file_path,
            created_at,
            branch_id,
            category_id
        `)
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML =
            `
            <div class="error">
                ❌ تعذر تحميل المراجع.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
            `;

        return;

    }


    allReferences =
        data || [];


    document
        .getElementById(
            "referencesCount"
        )
        .textContent =
        allReferences.length;


    await loadBranchesCount();


    displayReferences(
        allReferences
    );

}


/* =========================================
   عدد الفروع
========================================= */


async function loadBranchesCount() {

    const {
        count,
        error
    } =
        await supabaseClient
        .from("branches")
        .select(
            "*",
            {
                count: "exact",
                head: true
            }
        );


    if (!error) {

        document
            .getElementById(
                "branchesCount"
            )
            .textContent =
            count ?? 0;

    }

}


/* =========================================
   عرض المراجع
========================================= */


async function displayReferences(
    references
) {

    const container =
        document.getElementById(
            "referencesContainer"
        );


    if (!references.length) {

        container.innerHTML =
            `
            <div class="empty">

                📚 لا توجد مراجع.

            </div>
            `;

        return;

    }


    container.innerHTML =
        `
        <div class="loading">
            ⏳ جاري تجهيز القائمة...
        </div>
        `;


    /* الفروع */

    const {
        data: branches
    } =
        await supabaseClient
        .from("branches")
        .select(
            "id,name"
        );


    /* التصنيفات */

    const {
        data: categories
    } =
        await supabaseClient
        .from("reference_categories")
        .select(
            "id,name"
        );


    const branchMap = {};

    (branches || []).forEach(
        branch => {

            branchMap[
                branch.id
            ] =
            branch.name;

        }
    );


    const categoryMap = {};

    (categories || []).forEach(
        category => {

            categoryMap[
                category.id
            ] =
            category.name;

        }
    );


    container.innerHTML = "";


    references.forEach(
        reference => {


            let pdfUrl = "";


            if (
                reference.file_path
            ) {

                const {
                    data
                } =
                    supabaseClient
                    .storage
                    .from(
                        "legal-pdfs"
                    )
                    .getPublicUrl(
                        reference.file_path
                    );


                pdfUrl =
                    data.publicUrl;

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "reference-card";


            card.innerHTML =
                `

                <h2 class="reference-title">

                    📚
                    ${escapeHTML(
                        reference.title
                    )}

                </h2>


                <div class="reference-info">

                    ${
                        reference.author
                        ?
                        `
                        <div>
                            ✍️ المؤلف:
                            <strong>
                                ${escapeHTML(
                                    reference.author
                                )}
                            </strong>
                        </div>
                        `
                        :
                        ""
                    }


                    <div>

                        ⚖️ الفرع:

                        <strong>

                            ${
                                branchMap[
                                    reference.branch_id
                                ]
                                ||
                                "غير محدد"
                            }

                        </strong>

                    </div>


                    <div>

                        🗂️ التصنيف:

                        <strong>

                            ${
                                categoryMap[
                                    reference.category_id
                                ]
                                ||
                                "غير محدد"
                            }

                        </strong>

                    </div>

                </div>


                ${
                    reference.description
                    ?
                    `
                    <div class="description">

                        ${escapeHTML(
                            reference.description
                        )}

                    </div>
                    `
                    :
                    ""
                }


                <div class="card-actions">


                    ${
                        pdfUrl
                        ?
                        `
                        <a
                            href="${pdfUrl}"
                            target="_blank"
                            class="btn btn-primary">

                            📄 فتح PDF

                        </a>
                        `
                        :
                        ""
                    }


                    <a
                        href="edit-reference.html?id=${reference.id}"
                        class="btn btn-success">

                        ✏️ تعديل

                    </a>


                    <button
                        class="btn btn-danger"
                        onclick="deleteReference(${reference.id})">

                        🗑️ حذف

                    </button>


                </div>

                `;


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================
   البحث
========================================= */


document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function () {

            const search =
                this.value
                .trim()
                .toLowerCase();


            const filtered =
                allReferences.filter(
                    reference => {

                        const title =
                            (
                                reference.title
                                ||
                                ""
                            )
                            .toLowerCase();


                        const author =
                            (
                                reference.author
                                ||
                                ""
                            )
                            .toLowerCase();


                        return (
                            title.includes(
                                search
                            )
                            ||
                            author.includes(
                                search
                            )
                        );

                    }
                );


            displayReferences(
                filtered
            );

        }
    );


/* =========================================
   حذف المرجع
========================================= */


async function deleteReference(
    id
) {

    const reference =
        allReferences.find(
            item =>
                item.id === id
        );


    if (!reference) {

        return;

    }


    const confirmed =
        confirm(
            "هل أنت متأكد من حذف هذا المرجع؟\n\nسيتم حذف المرجع وملف PDF المرتبط به."
        );


    if (!confirmed) {

        return;

    }


    try {


        /* حذف الملف */

        if (
            reference.file_path
        ) {

            const {
                error: storageError
            } =
                await supabaseClient
                .storage
                .from(
                    "legal-pdfs"
                )
                .remove([
                    reference.file_path
                ]);


            if (storageError) {

                console.error(
                    storageError
                );

            }

        }


        /* حذف السجل */

        const {
            error
        } =
            await supabaseClient
            .from("references")
            .delete()
            .eq(
                "id",
                id
            );


        if (error) {

            throw error;

        }


        alert(
            "تم حذف المرجع بنجاح."
        );


        loadReferences();


    } catch (error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء حذف المرجع."
        );

    }

}


/* =========================================
   حماية HTML
========================================= */


function escapeHTML(
    value
) {

    if (!value) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   التشغيل
========================================= */


document.addEventListener(
    "DOMContentLoaded",
    function () {

        checkSession();

    }
);


</script>


</body>

</html>
