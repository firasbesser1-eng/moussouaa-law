<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>الفرع القانوني | الموسوعة القانونية</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#071a35,#123e69);
    color:white;
    padding:38px 20px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.18);
}

.logo{
    font-size:29px;
    font-weight:bold;
}

.manager{
    margin-top:10px;
    color:#dbeafe;
    font-size:13px;
}

nav{
    background:white;
    padding:14px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:100;
}

nav a{
    text-decoration:none;
    color:#123e69;
    font-weight:bold;
    margin:0 10px;
}

.container{
    width:min(1100px,94%);
    margin:30px auto;
}

.branch-header{
    background:white;
    border-radius:20px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.07);
    margin-bottom:25px;
}

.branch-icon{
    font-size:48px;
    margin-bottom:10px;
}

.branch-header h1{
    color:#123e69;
    margin:5px 0 10px;
    font-size:30px;
}

.branch-description{
    color:#667085;
    line-height:1.8;
    max-width:750px;
    margin:auto;
}

.stats{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:22px;
    flex-wrap:wrap;
}

.stat{
    background:#f5f8fc;
    border:1px solid #e5eaf1;
    border-radius:14px;
    padding:12px 22px;
    min-width:130px;
}

.stat strong{
    display:block;
    color:#123e69;
    font-size:22px;
}

.stat span{
    color:#667085;
    font-size:12px;
}

.controls{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    margin-bottom:25px;
}

.search{
    width:100%;
    padding:16px;
    border:1px solid #d6dce5;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.search:focus{
    border-color:#123e69;
    box-shadow:0 0 0 3px rgba(18,62,105,.1);
}

.filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:12px;
}

select{
    width:100%;
    padding:13px;
    border:1px solid #d6dce5;
    border-radius:11px;
    background:white;
    font-size:14px;
}

.results-info{
    color:#667085;
    margin-bottom:15px;
}

.results-info strong{
    color:#123e69;
}

.references{
    display:grid;
    gap:18px;
}

.reference-card{
    background:white;
    border-radius:18px;
    padding:22px;
    border:1px solid #edf0f5;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.reference-card h2{
    margin:0 0 12px;
    color:#123e69;
    font-size:20px;
}

.meta{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.badge{
    background:#eef5fc;
    color:#123e69;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.description{
    color:#667085;
    line-height:1.8;
    margin-bottom:18px;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.action{
    text-decoration:none;
    padding:11px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:bold;
}

.pdf{
    background:#123e69;
    color:white;
}

.search-all{
    background:#eef2f6;
    color:#123e69;
}

.status{
    text-align:center;
    padding:30px;
    color:#667085;
}

.error{
    background:#fff1f2;
    color:#b42318;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

.empty{
    background:white;
    border-radius:18px;
    padding:40px 20px;
    text-align:center;
    color:#667085;
}

.empty strong{
    display:block;
    color:#123e69;
    font-size:20px;
    margin-bottom:8px;
}

footer{
    margin-top:50px;
    background:#071a35;
    color:white;
    text-align:center;
    padding:30px 20px;
}

footer p{
    margin:7px;
}

@media(max-width:600px){

    .branch-header h1{
        font-size:25px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .reference-card{
        padding:18px;
    }

    nav a{
        display:inline-block;
        margin:5px 6px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        ⚖️ الموسوعة القانونية
    </div>

    <div class="manager">
        فراس بسر — مدير الموسوعة القانونية
    </div>

</header>


<nav>

    <a href="index.html">
        الرئيسية
    </a>

    <a href="search.html">
        البحث القانوني
    </a>

    <a href="admin.html">
        لوحة الإدارة
    </a>

</nav>


<div class="container">


<section class="branch-header">

    <div
        id="branchIcon"
        class="branch-icon"
    >
        ⚖️
    </div>

    <h1 id="branchTitle">
        جاري التحميل...
    </h1>

    <p
        id="branchDescription"
        class="branch-description"
    >
        جاري تحميل بيانات الفرع...
    </p>


    <div class="stats">

        <div class="stat">

            <strong id="referenceCount">
                0
            </strong>

            <span>
                المراجع
            </span>

        </div>


        <div class="stat">

            <strong id="categoryCount">
                0
            </strong>

            <span>
                التصنيفات
            </span>

        </div>

    </div>

</section>


<section class="controls">

    <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="🔎 ابحث داخل مراجع هذا الفرع..."
        autocomplete="off"
    >


    <div class="filters">

        <select id="categoryFilter">

            <option value="">
                📚 جميع التصنيفات
            </option>

        </select>


        <select id="authorFilter">

            <option value="">
                ✍️ جميع المؤلفين
            </option>

        </select>

    </div>

</section>


<div
    id="resultsInfo"
    class="results-info"
>
    جاري تحميل المراجع...
</div>


<div
    id="references"
    class="references"
></div>


</div>


<footer>

    <p>
        ⚖️ الموسوعة القانونية
    </p>

    <p>
        فراس بسر — مدير الموسوعة القانونية
    </p>

    <p>
        جميع الحقوق محفوظة © 2026
    </p>

</footer>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://yksrckzomkowjzmsafvm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VEa1cABilAnrnclvOTv-IA_yFcn7aIV";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   ELEMENTS
===================================== */

const branchTitle =
document.getElementById("branchTitle");

const branchDescription =
document.getElementById("branchDescription");

const branchIcon =
document.getElementById("branchIcon");

const referenceCount =
document.getElementById("referenceCount");

const categoryCount =
document.getElementById("categoryCount");

const searchInput =
document.getElementById("searchInput");

const categoryFilter =
document.getElementById("categoryFilter");

const authorFilter =
document.getElementById("authorFilter");

const results =
document.getElementById("references");

const resultsInfo =
document.getElementById("resultsInfo");


/* =====================================
   BRANCH SLUG
===================================== */

const params =
new URLSearchParams(
    window.location.search
);

const branchSlug =
params.get("branch");


/* =====================================
   DATA
===================================== */

let currentBranch = null;
let allReferences = [];


/* =====================================
   ICONS
===================================== */

function getBranchIcon(slug){

    const icons = {

        civil:"⚖️",
        commercial:"🏢",
        administrative:"🏛️",
        constitutional:"📜",
        criminal:"⚔️",
        "private-international":"🌍",
        "public-international":"🌐",
        labor:"👔",
        tax:"💼",
        arbitration:"🤝",
        books:"📚",
        research:"🎓",
        maritime:"⚓"

    };

    return icons[slug] || "⚖️";

}


/* =====================================
   DESCRIPTION
===================================== */

function getBranchDescription(slug){

    const descriptions = {

        civil:
        "المعاملات المدنية والالتزامات والعقود والمسؤولية المدنية.",

        commercial:
        "القانون التجاري والشركات والأعمال والمعاملات التجارية.",

        administrative:
        "القانون الإداري والمرفق العام والقرارات الإدارية.",

        constitutional:
        "الدستور والمؤسسات والحقوق والحريات والنظام السياسي.",

        criminal:
        "القانون الجزائي والجرائم والعقوبات والإجراءات الجزائية.",

        "private-international":
        "العلاقات الخاصة ذات العنصر الأجنبي وتنازع القوانين والاختصاص.",

        "public-international":
        "العلاقات الدولية والمعاهدات والمنظمات والقانون الدولي.",

        labor:
        "علاقات الشغل وعقود العمل والنزاعات والضمانات الاجتماعية.",

        tax:
        "القانون الجبائي والضرائب والإجراءات والمنازعات الجبائية.",

        arbitration:
        "التحكيم الوطني والدولي وتسوية المنازعات التجارية.",

        books:
        "مجموعة من الكتب والمراجع القانونية المتخصصة.",

        research:
        "البحوث والمذكرات والأعمال الأكاديمية القانونية.",

        maritime:
        "القانون البحري والسفن والملاحة البحرية والعلاقات القانونية البحرية."

    };

    return descriptions[slug]
        ||
        "المراجع والمواد القانونية الخاصة بهذا المجال.";

}


/* =====================================
   LOAD BRANCH
===================================== */

async function loadBranch(){

    if(!branchSlug){

        showError(
            "لم يتم تحديد الفرع القانوني."
        );

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient

        .from("branches")

        .select(
            "id,name,slug"
        )

        .eq(
            "slug",
            branchSlug
        )

        .single();


    if(error || !data){

        console.error(error);

        showError(
            "الفرع القانوني غير موجود."
        );

        return;

    }


    currentBranch =
        data;


    document.title =
        data.name
        +
        " | الموسوعة القانونية";


    branchTitle.textContent =
        data.name;


    branchDescription.textContent =
        getBranchDescription(
            data.slug
        );


    branchIcon.textContent =
        getBranchIcon(
            data.slug
        );


    await loadReferences();

}


/* =====================================
   LOAD REFERENCES
===================================== */

async function loadReferences(){

    resultsInfo.textContent =
        "⏳ جاري تحميل المراجع...";


    const {
        data,
        error
    } =
    await supabaseClient

        .from("references")

        .select(`
            id,
            title,
            author,
            description,
            file_path,
            category_id,
            created_at,
            reference_categories (
                id,
                name,
                slug
            )
        `)

        .eq(
            "branch_id",
            currentBranch.id
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        showError(
            "تعذر تحميل مراجع هذا الفرع."
        );

        return;

    }


    allReferences =
        data || [];


    referenceCount.textContent =
        allReferences.length;


    loadCategoryFilter();

    loadAuthorFilter();

    renderReferences(
        allReferences
    );

}


/* =====================================
   CATEGORY FILTER
===================================== */

function loadCategoryFilter(){

    categoryFilter.innerHTML = `

        <option value="">
            📚 جميع التصنيفات
        </option>

    `;


    const categories = [];


    allReferences.forEach(
        reference => {

            const category =
                reference.reference_categories;


            if(
                category &&
                !categories.some(
                    item =>
                        item.id === category.id
                )
            ){

                categories.push(
                    category
                );

            }

        }
    );


    categoryCount.textContent =
        categories.length;


    categories
        .sort(
            (a,b) =>
                a.name.localeCompare(
                    b.name,
                    "ar"
                )
        )
        .forEach(
            category => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    category.id;

                option.textContent =
                    category.name;

                categoryFilter.appendChild(
                    option
                );

            }
        );

}


/* =====================================
   AUTHOR FILTER
===================================== */

function loadAuthorFilter(){

    authorFilter.innerHTML = `

        <option value="">
            ✍️ جميع المؤلفين
        </option>

    `;


    const authors =
        [
            ...new Set(
                allReferences
                    .map(
                        item =>
                            item.author
                    )
                    .filter(
                        Boolean
                    )
            )
        ];


    authors
        .sort(
            (a,b) =>
                a.localeCompare(
                    b,
                    "ar"
                )
        )
        .forEach(
            author => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    author;

                option.textContent =
                    author;

                authorFilter.appendChild(
                    option
                );

            }
        );

}


/* =====================================
   FILTER
===================================== */

function filterReferences(){

    const text =
        searchInput.value
            .trim()
            .toLowerCase();


    const category =
        categoryFilter.value;


    const author =
        authorFilter.value;


    const filtered =
        allReferences.filter(
            reference => {

                const title =
                    (
                        reference.title
                        || ""
                    )
                    .toLowerCase();


                const referenceAuthor =
                    (
                        reference.author
                        || ""
                    )
                    .toLowerCase();


                const description =
                    (
                        reference.description
                        || ""
                    )
                    .toLowerCase();


                const matchesText =
                    !text
                    ||
                    title.includes(text)
                    ||
                    referenceAuthor.includes(text)
                    ||
                    description.includes(text);


                const matchesCategory =
                    !category
                    ||
                    String(
                        reference.category_id
                    )
                    ===
                    String(category);


                const matchesAuthor =
                    !author
                    ||
                    reference.author
                    ===
                    author;


                return (
                    matchesText
                    &&
                    matchesCategory
                    &&
                    matchesAuthor
                );

            }
        );


    renderReferences(
        filtered
    );

}


/* =====================================
   RENDER
===================================== */

function renderReferences(
    references
){

    results.innerHTML =
        "";


    resultsInfo.innerHTML =
        "عدد النتائج: "
        +
        "<strong>"
        +
        references.length
        +
        "</strong>";


    if(
        !references ||
        references.length === 0
    ){

        results.innerHTML = `

            <div class="empty">

                <strong>
                    🔎 لا توجد نتائج
                </strong>

                جرّب تغيير عبارة البحث
                أو الفلاتر.

            </div>

        `;

        return;

    }


    references.forEach(
        reference => {

            const category =
                reference.reference_categories;


            let pdfUrl = "";


            if(reference.file_path){

                pdfUrl =
                    supabaseClient

                    .storage

                    .from("legal-pdfs")

                    .getPublicUrl(
                        reference.file_path
                    )
                    .data
                    .publicUrl;

            }


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "reference-card";


            card.innerHTML = `

                <h2>

                    ${escapeHTML(
                        reference.title
                    )}

                </h2>


                <div class="meta">

                    ${
                        reference.author
                        ?
                        `
                        <span class="badge">
                            ✍️
                            ${escapeHTML(
                                reference.author
                            )}
                        </span>
                        `
                        :
                        ""
                    }


                    ${
                        category
                        ?
                        `
                        <span class="badge">
                            📚
                            ${escapeHTML(
                                category.name
                            )}
                        </span>
                        `
                        :
                        ""
                    }

                </div>


                ${
                    reference.description
                    ?
                    `
                    <div class="description">
                        ${escapeHTML(
                            reference.description
                        )}
                    </div>
                    `
                    :
                    ""
                }


                <div class="actions">

                    ${
                        pdfUrl
                        ?
                        `
                        <a
                            class="action pdf"
                            href="${pdfUrl}"
                            target="_blank"
                            rel="noopener"
                        >
                            📄 فتح ملف PDF
                        </a>
                        `
                        :
                        ""
                    }


                    <a
                        class="action search-all"
                        href="search.html"
                    >
                        🔎 البحث في جميع المراجع
                    </a>

                </div>

            `;


            results.appendChild(
                card
            );

        }
    );

}


/* =====================================
   ERROR
===================================== */

function showError(
    message
){

    resultsInfo.textContent =
        "";

    results.innerHTML = `

        <div class="error">

            ❌
            ${escapeHTML(
                message
            )}

        </div>

    `;

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(
    value
){

    if(!value){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================
   EVENTS
===================================== */

searchInput.addEventListener(
    "input",
    filterReferences
);

categoryFilter.addEventListener(
    "change",
    filterReferences
);

authorFilter.addEventListener(
    "change",
    filterReferences
);


/* =====================================
   START
===================================== */

loadBranch();

</script>


</body>

</html>
