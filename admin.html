<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة إدارة الموسوعة القانونية</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

.container {
    width: 92%;
    max-width: 500px;
    margin: 60px auto;
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #102a43;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #667085;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 28px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
    text-align: center;
}

label {
    display: block;
    margin: 16px 0 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d0d5dd;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #102a43;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .92;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #102a43;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">⚖️ الموسوعة القانونية</div>

    <div class="subtitle">
        لوحة إدارة المكتبة القانونية
    </div>

    <div class="card">

        <h2>🔐 دخول المدير</h2>

        <label for="email">البريد الإلكتروني</label>

        <input
            type="email"
            id="email"
            placeholder="أدخل بريد المدير"
            autocomplete="email"
        >

        <label for="password">كلمة المرور</label>

        <input
            type="password"
            id="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
        >

        <button onclick="login()">
            دخول إلى لوحة الإدارة
        </button>

        <div id="message" class="message"></div>

    </div>

    <a class="back" href="index.html">
        ← العودة إلى الموسوعة
    </a>

</div>

<script>

const SUPABASE_URL = "https://yksrckzomkowjzmsafvm.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_VEa1cABilAnrnclvOTv-IA_yFcn7aIV";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    message.textContent = "";

    if (!email || !password) {
        message.textContent = "يرجى إدخال البريد الإلكتروني وكلمة المرور.";
        return;
    }

    message.textContent = "جاري تسجيل الدخول...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

    message.textContent =
        "خطأ: " + error.message;

    console.error(error);

    return;
}

    message.textContent =
        "تم تسجيل الدخول بنجاح ✓";

    setTimeout(() => {

        window.location.href = "dashboard.html";

    }, 700);
}

</script>

</body>
</html>
