<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>إضافة مرجع - الموسوعة القانونية</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
    Tahoma,
    Arial,
    sans-serif;

    background: #f4f7fb;

    color: #172033;
}

header {

    background:
    linear-gradient(
        135deg,
        #0b1f3a,
        #173b68
    );

    color: white;

    padding: 22px 5%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;
}

.logo {

    font-size: 22px;

    font-weight: bold;
}

.logo small {

    display: block;

    font-size: 12px;

    opacity: .8;

    margin-top: 5px;
}

.back {

    color: white;

    text-decoration: none;

    background: rgba(255,255,255,.15);

    padding: 9px 14px;

    border-radius: 9px;
}

main {

    width: 92%;

    max-width: 700px;

    margin: 30px auto;
}

.card {

    background: white;

    padding: 28px;

    border-radius: 18px;

    box-shadow:
    0 8px 30px rgba(0,0,0,.07);
}

h1 {

    margin-top: 0;

    color: #0b1f3a;
}

.subtitle {

    color: #667085;

    margin-bottom: 25px;
}

label {

    display: block;

    font-weight: bold;

    margin:
    18px 0 7px;
}

input,
select,
textarea {

    width: 100%;

    padding: 13px;

    border:
    1px solid #d0d5dd;

    border-radius: 10px;

    font-size: 16px;

    background: white;
}

textarea {

    min-height: 120px;

    resize: vertical;
}

input[type="file"] {

    padding: 11px;

    background: #f8fafc;
}

button {

    width: 100%;

    border: none;

    margin-top: 25px;

    padding: 15px;

    border-radius: 11px;

    background: #0b1f3a;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

button:disabled {

    opacity: .6;

    cursor: not-allowed;
}

.message {

    margin-top: 18px;

    padding: 12px;

    border-radius: 10px;

    text-align: center;

    display: none;
}

.info {

    background: #eef6ff;

    color: #175cd3;

    display: block;
}

.success {

    background: #ecfdf3;

    color: #027a48;

    display: block;
}

.error {

    background: #fef3f2;

    color: #b42318;

    display: block;
}

.note {

    background: #f8fafc;

    padding: 15px;

    border-radius: 10px;

    margin-top: 20px;

    color: #667085;

    font-size: 14px;

    line-height: 1.8;
}

@media(max-width:600px) {

    header {

        flex-direction: column;

        text-align: center;
    }

    .card {

        padding: 20px;
    }
}

</style>

</head>


<body>


<header>

    <div class="logo">

        ⚖️ الموسوعة القانونية

        <small>
            إضافة مرجع جديد
        </small>

    </div>

    <a
        class="back"
        href="dashboard.html">

        ← لوحة الإدارة

    </a>

</header>


<main>

<div class="card">

    <h1>
        ➕ إضافة مرجع جديد
    </h1>

    <div class="subtitle">

        أضف مرجعًا قانونيًا إلى أحد فروع الموسوعة.

    </div>


    <form
        id="referenceForm">


        <!-- العنوان -->

        <label>
            عنوان المرجع *
        </label>

        <input
            type="text"
            id="title"
            placeholder="مثال: مجلة الالتزامات والعقود"
            required>


        <!-- المؤلف -->

        <label>
            المؤلف / الجهة
        </label>

        <input
            type="text"
            id="author"
            placeholder="مثال: الجمهورية التونسية">


        <!-- الفرع -->

        <label>
            الفرع القانوني *
        </label>

        <select
            id="branch"
            required>

            <option value="">
                اختر الفرع
            </option>

        </select>


        <!-- النوع -->

        <label>
            نوع المرجع *
        </label>

        <select
            id="category"
            required>

            <option value="">
                اختر نوع المرجع
            </option>

        </select>


        <!-- الوصف -->

        <label>
            وصف المرجع
        </label>

        <textarea
            id="description"
            placeholder="اكتب وصفًا مختصرًا للمرجع...">
        </textarea>


        <!-- PDF -->

        <label>
            ملف PDF *
        </label>

        <input
            type="file"
            id="pdf"
            accept="application/pdf"
            required>


        <div class="note">

            📌 يمكنك اختيار ملف PDF من هاتفك.

            <br>

            📌 يفضّل استعمال ملفات قانونية مسموح بإعادة نشرها.

            <br>

            📌 بعد الإضافة سيتم حفظ بيانات المرجع في قاعدة البيانات.

        </div>


        <button
            type="submit"
            id="submitBtn">

            📤 إضافة المرجع

        </button>


        <div
            id="message"
            class="message">
        </div>


    </form>

</div>

</main>


<script>


/* =========================================
   بيانات Supabase
========================================= */

const SUPABASE_URL =
"https://yksrckzomkowjzmsafvm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VEa1cABilAnrnclvOTv-IA_yFcn7aIV";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   التأكد من تسجيل دخول المدير
========================================= */

async function checkUser() {

    const { data } =
    await supabaseClient
    .auth
    .getSession();

    if (!data.session) {

        window.location.href =
        "admin.html";

        return false;
    }

    return true;
}


/* =========================================
   تحميل الفروع
========================================= */

async function loadBranches() {

    const { data, error } =
    await supabaseClient
    .from("branches")
    .select("id, name")
    .order("id");

    if (error) {

        showMessage(
            "تعذر تحميل الفروع: "
            + error.message,
            "error"
        );

        return;
    }


    const select =
    document.getElementById("branch");


    data.forEach(branch => {

        const option =
        document.createElement("option");

        option.value =
        branch.id;

        option.textContent =
        branch.name;

        select.appendChild(option);

    });

}


/* =========================================
   تحميل أنواع المراجع
========================================= */

async function loadCategories() {

    const { data, error } =
    await supabaseClient
    .from("reference_categories")
    .select("id, name")
    .order("id");

    if (error) {

        showMessage(
            "تعذر تحميل أنواع المراجع: "
            + error.message,
            "error"
        );

        return;
    }


    const select =
    document.getElementById("category");


    data.forEach(category => {

        const option =
        document.createElement("option");

        option.value =
        category.id;

        option.textContent =
        category.name;

        select.appendChild(option);

    });

}


/* =========================================
   رفع الملف
========================================= */

async function uploadPDF(file) {

    const fileName =
    Date.now()
    + "-"
    + file.name;


    const filePath =
    "references/"
    + fileName;


    const { error } =
    await supabaseClient
    .storage
    .from("legal-pdfs")
    .upload(
        filePath,
        file,
        {
            contentType:
            "application/pdf",

            upsert: false
        }
    );


    if (error) {

        throw error;

    }


    return filePath;
}


/* =========================================
   إضافة المرجع
========================================= */

document
.getElementById("referenceForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const button =
        document.getElementById(
            "submitBtn"
        );


        button.disabled = true;

        button.textContent =
        "⏳ جاري رفع المرجع...";


        showMessage(
            "جاري رفع الملف وحفظ البيانات...",
            "info"
        );


        try {

            const title =
            document
            .getElementById("title")
            .value
            .trim();


            const author =
            document
            .getElementById("author")
            .value
            .trim();


            const branchId =
            document
            .getElementById("branch")
            .value;


            const categoryId =
            document
            .getElementById("category")
            .value;


            const description =
            document
            .getElementById("description")
            .value
            .trim();


            const file =
            document
            .getElementById("pdf")
            .files[0];


            if (!file) {

                throw new Error(
                    "يرجى اختيار ملف PDF."
                );

            }


            /* رفع PDF */

            const filePath =
            await uploadPDF(file);


            /* حفظ بيانات المرجع */

            const { error } =
            await supabaseClient
            .from("references")
            .insert({

                title: title,

                author: author || null,

                description:
                description || null,

                branch_id:
                Number(branchId),

                category_id:
                Number(categoryId),

                file_path:
                filePath

            });


            if (error) {

                /* إذا فشل حفظ البيانات
                   نحاول حذف الملف */

                await supabaseClient
                .storage
                .from("legal-pdfs")
                .remove([filePath]);


                throw error;
            }


            showMessage(
                "✅ تمت إضافة المرجع بنجاح!",
                "success"
            );


            document
            .getElementById("referenceForm")
            .reset();


            button.textContent =
            "📤 إضافة مرجع";


        }

        catch(error) {

            console.error(error);


            showMessage(
                "❌ حدث خطأ: "
                + error.message,
                "error"
            );


            button.textContent =
            "📤 إضافة المرجع";

        }


        button.disabled = false;

    }
);


/* =========================================
   الرسائل
========================================= */

function showMessage(
    text,
    type
) {

    const message =
    document.getElementById(
        "message"
    );


    message.textContent =
    text;

    message.className =
    "message "
    + type;

}


/* =========================================
   تشغيل الصفحة
========================================= */

(async function() {

    const loggedIn =
    await checkUser();


    if (!loggedIn) {

        return;

    }


    await loadBranches();

    await loadCategories();

})();

</script>

</body>

</html>
