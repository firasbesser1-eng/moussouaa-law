<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القانون المدني | الموسوعة القانونية</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f5f7fa;
    color:#172033;
    line-height:1.8;
}

header{
    background:linear-gradient(135deg,#0b1f3a,#163d68);
    color:white;
    text-align:center;
    padding:35px 15px;
}

header h1{
    font-size:32px;
    margin-bottom:8px;
}

header p{
    opacity:.9;
    font-size:16px;
}

.container{
    max-width:1000px;
    margin:30px auto;
    padding:0 15px;
}

.back{
    display:inline-block;
    background:#0b1f3a;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:10px;
    margin-bottom:25px;
}

.section-title{
    text-align:center;
    font-size:27px;
    margin-bottom:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.card{
    background:white;
    padding:25px 18px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.icon{
    font-size:42px;
    margin-bottom:10px;
}

.card h2{
    font-size:20px;
    margin-bottom:8px;
}

.card p{
    color:#687386;
    font-size:14px;
    margin-bottom:18px;
}

.button{
    display:inline-block;
    text-decoration:none;
    background:#163d68;
    color:white;
    padding:10px 18px;
    border-radius:9px;
}

.info{
    background:white;
    padding:25px;
    border-radius:15px;
    margin-top:30px;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
}

footer
